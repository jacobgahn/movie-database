version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data  # For SQLite database persistence
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - UV_PROJECT_ENVIRONMENT=/app/.venv-container
    depends_on:
      redis:
        condition: service_healthy
    command: ["uv", "run", "fastapi", "dev", "main.py", "--host", "0.0.0.0", "--port", "8000"]

  celery:
    build: .
    volumes:
      - .:/app
      - ./data:/app/data  # For SQLite database persistence
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - UV_PROJECT_ENVIRONMENT=/app/.venv-container
    depends_on:
      redis:
        condition: service_healthy
    command: ["uv", "run", "celery", "-A", "app.celery_app", "worker", "--loglevel=info"]

volumes:
  redis_data:


